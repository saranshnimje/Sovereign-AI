name: Fix Gemini discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Gemini discovery
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/services/llm_client.py')
          s = p.read_text()
          marker = '''    async def health_check(self, model: str | None = None) -> tuple[bool, int | None]:\n        import time\n        try:\n            t0 = time.monotonic()\n            resp = await self._get_client().get(\n                f"/v1beta/models?key={self._api_key}", timeout=5.0\n            )\n            latency = int((time.monotonic() - t0) * 1000)\n            return resp.status_code < 500, latency\n        except Exception:\n            return False, None\n\n'''
          needle = '''    async def verify_auth(self, model: str | None = None) -> tuple[bool | None, str | None]:\n'''
          if 'class GeminiProvider' not in s or '    async def list_models(self) -> list[dict]:' in s[s.index('class GeminiProvider'):s.index('# ── Cohere Provider')]:
              raise SystemExit('GeminiProvider already patched or missing')
          method = '''    async def list_models(self) -> list[dict]:\n        """List Gemini models that support generateContent."""\n        try:\n            resp = await self._get_client().get(\n                "/v1beta/models",\n                params={"key": self._api_key, "pageSize": 1000},\n                timeout=10.0,\n            )\n            resp.raise_for_status()\n        except (httpx.ConnectError, httpx.TimeoutException) as exc:\n            raise ModelUnavailableError(str(exc)) from exc\n        except httpx.HTTPStatusError as exc:\n            body = exc.response.text[:500] if exc.response else ""\n            raise ModelUnavailableError(f"Gemini model listing failed: {body}") from exc\n\n        data = resp.json()\n        models: list[dict] = []\n        for model in data.get("models", []):\n            if not isinstance(model, dict):\n                continue\n            if "generateContent" not in (model.get("supportedGenerationMethods") or []):\n                continue\n            name = model.get("name", "")\n            if name.startswith("models/"):\n                name = name[len("models/"):]\n            if not name:\n                continue\n            models.append({\n                "id": name,\n                "name": name,\n                "display_name": model.get("displayName") or name,\n                "description": model.get("description", ""),\n                "input_token_limit": model.get("inputTokenLimit"),\n                "output_token_limit": model.get("outputTokenLimit"),\n                "supported_generation_methods": model.get("supportedGenerationMethods", []),\n            })\n\n        # The Models API is paginated. Fetch remaining pages if present.\n        next_token = data.get("nextPageToken")\n        while next_token:\n            resp = await self._get_client().get(\n                "/v1beta/models",\n                params={"key": self._api_key, "pageSize": 1000, "pageToken": next_token},\n                timeout=10.0,\n            )\n            resp.raise_for_status()\n            page = resp.json()\n            for model in page.get("models", []):\n                if not isinstance(model, dict) or "generateContent" not in (model.get("supportedGenerationMethods") or []):\n                    continue\n                name = model.get("name", "")\n                if name.startswith("models/"):\n                    name = name[len("models/"):]\n                if name:\n                    models.append({\n                        "id": name,\n                        "name": name,\n                        "display_name": model.get("displayName") or name,\n                        "description": model.get("description", ""),\n                        "input_token_limit": model.get("inputTokenLimit"),\n                        "output_token_limit": model.get("outputTokenLimit"),\n                        "supported_generation_methods": model.get("supportedGenerationMethods", []),\n                    })\n            next_token = page.get("nextPageToken")\n        return models\n\n'''
          if marker not in s:
              raise SystemExit('Gemini health_check marker not found')
          s = s.replace(marker, marker + method, 1)
          p.write_text(s)

          p = Path('backend/models/provider.py')
          s = p.read_text()
          old = '        "supports_discovery": False,\n        "adapter": "GeminiProvider",'
          new = '        "supports_discovery": True,\n        "adapter": "GeminiProvider",'
          if old not in s:
              raise SystemExit('Gemini preset marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          helper = Path('backend/services/gemini_model_discovery_fix.py')
          if helper.exists():
              helper.unlink()
          PY

      - name: Verify
        run: |
          python -m py_compile backend/services/llm_client.py backend/models/provider.py
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/services/llm_client.py').read_text()
          start = s.index('class GeminiProvider')
          end = s.index('# ── Cohere Provider')
          assert 'async def list_models' in s[start:end]
          assert 'supportedGenerationMethods' in s[start:end]
          assert '"supports_discovery": True' in Path('backend/models/provider.py').read_text()
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/llm_client.py backend/models/provider.py
          git rm .github/workflows/fix-gemini-discovery.yml
          git add -u backend/services/gemini_model_discovery_fix.py
          git commit -m "fix: discover Gemini models from native API"
          git push
