# Development override — hot-reload for frontend and backend.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  frontend:
    build:
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    # Override depends_on — don't wait for backend healthcheck in dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - LOG_LEVEL=DEBUG
      - FRONTEND_ORIGIN=http://localhost:5173
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sqlite/sovereign.db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-abc123}
      # DATA_DIR is /app/data inside Docker (default).
      # For local-only dev without Docker, set DATA_DIR=./data in your .env
    volumes:
      - ./backend:/app:ro          # mount source for hot-reload (read-only)
      - backend_data:/app/data     # data volume still writable
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
