# Development override — hot-reload for frontend and backend.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  frontend:
    build:
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      - VITE_API_URL=http://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment:
      - LOG_LEVEL=DEBUG
      - FRONTEND_ORIGIN=http://localhost:5173
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sqlite/sovereign.db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL:-qwen3:14b}
      - DEFAULT_VISION_MODEL=${DEFAULT_VISION_MODEL:-llava:7b}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-abc123}
      - DOCKER_HOST=tcp://dockerproxy:2375
      # Agent configuration (relaxed for dev)
      - AGENT_MAX_ITERATIONS=30
      - AGENT_MAX_TOOL_CALLS=20
      - AGENT_MAX_EXECUTION_TIME_S=300
      - TERMINAL_ENABLED=true
      - TERMINAL_TIMEOUT_S=30
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - /app/__pycache__
    ports:
      - "8000:8000"
