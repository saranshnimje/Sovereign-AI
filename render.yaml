services:
  - type: web
    name: sovereign-ai-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        value: change-this-to-a-real-secret-key-32-chars-minimum
      - key: ENVIRONMENT
        value: production
      - key: QDRANT_URL
        value: https://placeholder.qdrant.io
      - key: QDRANT_API_KEY
        value: placeholder
      - key: FRONTEND_ORIGIN
        value: https://placeholder.vercel.app
      - key: OLLAMA_URL
        value: ""
      - key: DATA_DIR
        value: /app/data
      - key: DEFAULT_CHAT_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DEFAULT_VISION_MODEL
        value: ""
      - key: LOG_LEVEL
        value: INFO
