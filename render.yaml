services:
  - type: web
    name: sovereign-ai-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://sovereign-ai-workbench-2026.vercel.app
      - key: FRONTEND_ORIGINS
        value: https://sovereign-ai-workbench-2026.vercel.app
      - key: OLLAMA_URL
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: DEFAULT_CHAT_MODEL
        value: llama3.2:3b
      - key: DEFAULT_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: DEFAULT_VISION_MODEL
        value: ""
      - key: LOG_LEVEL
        value: INFO
      - key: AGENT_MAX_ITERATIONS
        value: "50"
      - key: AGENT_MAX_TOOL_CALLS
        value: "30"
      - key: AGENT_MAX_EXECUTION_TIME_S
        value: "600"
      - key: TERMINAL_ENABLED
        value: "false"
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_REGION
        value: us-east-2
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_BUCKET
        sync: false
