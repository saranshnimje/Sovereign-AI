# Alembic configuration for Sovereign AI Workbench.
#
# The database URL is resolved at runtime from application settings
# (DATA_DIR / DATABASE_URL env vars) inside alembic/env.py — nothing
# secret lives in this file.
[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only — env.py overrides it from app settings.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
